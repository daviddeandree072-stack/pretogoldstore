# ───────────────────────────────────────────────────────────────
# Preto by Dala&Co · Configuración de Netlify
# ───────────────────────────────────────────────────────────────
# Sitio estático (HTML/CSS/JS) + funciones serverless.
# No hay paso de compilación: Netlify publica los archivos tal cual
# y detecta las funciones en netlify/functions.
# ───────────────────────────────────────────────────────────────

[build]
  # La carpeta que se publica. "." = la raíz del repositorio.
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Node fijado: el despliegue no cambia de versión sin avisar y
  # firebase-admin corre siempre sobre un runtime con soporte.
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# ── URLs limpias ───────────────────────────────────────────────
# /faq.html → /faq (301). Los enlaces internos, el sitemap y los
# canonical ya usan la versión limpia, así Google ve una sola URL.
# (La minificación de CSS/JS y la compresión de imágenes de Netlify
# dejaron de existir en 2023 y se ignoraban: ya no se declaran.)
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true

# ── Código y configuración del servidor: fuera del alcance público ──
# publish = "." publica la raíz completa, incluido el código de las
# funciones (netlify/), package.json y este archivo. Las funciones
# siguen respondiendo en /.netlify/functions/…; esto solo impide
# descargar su código fuente o la configuración desde el navegador.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_headers"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true
